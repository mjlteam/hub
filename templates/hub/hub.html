{% extends "base.html" %}

{% block title %}MJL-Team{% endblock %}

{% block header %}MJL-Team{% endblock %}

{% block content %}
<div class="space-y-6">
  <section class="card">
    <h2 class="text-xl font-semibold mb-2">Übersicht</h2>
    <p class="text-sm muted">Willkommen im Hub. Hier kommen Module zusammen.</p>
  </section>

  <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="card">
      <h3 class="font-medium">Module</h3>
      <ul class="mt-2 text-sm muted">
        <li>- Hub</li>
        <li>- auth</li>
      </ul>
    </div>

    <div class="card">
      <h3 class="font-medium">Status</h3>
      <p class="mt-2 text-sm muted">Server läuft auf {{ request.host }}.</p>
    </div>
  </section>
</div>
{% endblock %}
