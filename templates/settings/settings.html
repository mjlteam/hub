{% extends 'base.html' %}

{% block title %}Einstellungen — MJL-Team{% endblock %}

{% block content %}
<section style="max-width: 480px; padding: 32px 24px;">
    <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 24px;">Einstellungen</h2>

    <!-- Theme -->
    <div class="card" style="padding: 20px; margin-bottom: 16px;">
        <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 12px;">Erscheinungsbild</h3>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <span style="font-size: 0.875rem; color: var(--text-body);">Dark Mode</span>
            <button id="settings-theme-toggle" class="sidebar-theme-btn" aria-label="Theme umschalten" onclick="toggleTheme()" style="width:36px;height:36px;">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>

        <!-- OLED Dark Mode (echtes Schwarz) -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-soft);">
            <div>
                <span style="font-size: 0.875rem; color: var(--text-body);">OLED Dark Mode</span>
                <span class="caption" style="color: var(--text-tertiary); display: block;">Echtes Schwarz (#000000) für OLED-Displays</span>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="settings-oled-toggle" onchange="toggleOled(this.checked)">
                <span class="toggle-switch-track">
                    <span class="toggle-switch-thumb"></span>
                </span>
            </label>
        </div>
    </div>
    <script>
    (function(){
        var c = document.getElementById('settings-oled-toggle');
        if (c) c.checked = localStorage.getItem('theme') === 'oled';
    })();
    </script>

    <!-- Passwort ändern -->
    <div class="card" style="padding: 20px;">
        <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 16px;">Passwort ändern</h3>
        <form method="post" style="display: flex; flex-direction: column; gap: 12px;">
            <input type="hidden" name="action" value="change_password">
            <div class="form-group">
                <label class="form-label">Aktuelles Passwort</label>
                <input type="password" name="current_password" class="input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Neues Passwort</label>
                <input type="password" name="new_password" class="input" minlength="8" required>
                <span class="form-hint">Mindestens 8 Zeichen</span>
            </div>
            <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Passwort ändern</button>
        </form>
    </div>
</section>
{% endblock %}
