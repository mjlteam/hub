<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>{% block title %}MJL-Team{% endblock %}</title>
		<!-- Tailwind CDN (for quick prototyping) -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- htmx and Alpine for interactivity -->
		<script src="https://unpkg.com/htmx.org@1.10.1"></script>
		<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
		{% block head %}{% endblock %}
	</head>
	<body class="min-h-screen bg-gray-50 text-gray-900">
		<header class="bg-white shadow">
			<div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex items-center justify-between">
				<h1 class="text-lg font-semibold">{% block header %}Hub{% endblock %}</h1>
				<nav>
					<a href="/" class="text-sm text-gray-600 hover:text-gray-900">Home</a>
				</nav>
			</div>
		</header>

		<main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
			{% block content %}
			<!-- Page content -->
			{% endblock %}
		</main>

		<footer class="mt-12 py-6 bg-white">
			<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-sm text-gray-600">
				MJL
			</div>
		</footer>

		{% block scripts %}{% endblock %}
	</body>
</html>
