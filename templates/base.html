<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>{% block title %}MJL-Team{% endblock %}</title>
		<!-- Tailwind CDN (for quick prototyping) -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- Web fonts -->
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..72,400;8..72,600&display=swap" rel="stylesheet">
		<!-- custom design stylesheet -->
		<link rel="stylesheet" href="{{ url_for('static', filename='css/design.css') }}">
		<!-- favicon / app icons (use existing assets) -->
		<link rel="icon" href="{{ url_for('static', filename='logo/mjl-logo-square-transparent.ico') }}" type="image/x-icon">
		<link rel="apple-touch-icon" href="{{ url_for('static', filename='logo/mjl-logo-square-transparent.png') }}">
		<!-- htmx and Alpine for interactivity -->
		<script src="https://unpkg.com/htmx.org@1.10.1"></script>
		<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
		{% block head %}{% endblock %}
	</head>
	<body class="min-h-screen">
		<header class="site-header">
			<div class="container header-inner">
				<a href="/" class="brand" aria-label="MJL">
					<img src="{{ url_for('static', filename='logo/mjl-logo-square-transparent.png') }}" alt="MJL" class="site-logo">
				</a>
				<nav class="nav">
					<a href="/" class="nav-link">Home</a>
				</nav>
			</div>
		</header>

		<main class="container main-content">
			{% block content %}
			<!-- Page content -->
			{% endblock %}
		</main>

		<footer class="site-footer">
			<div class="container footer-inner">
				<div class="footer-brand">MJL-Team</div>
				<div class="footer-meta">&copy; {{ now().year }} MJL-Team</div>
			</div>
		</footer>

		{% block scripts %}{% endblock %}
	</body>
</html>
