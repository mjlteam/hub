{% extends "base.html" %}

{% block title %}Zugriff verweigert (403){% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align: center;">
        <p class="display" style="font-size: 5rem; margin-bottom: 8px; font-family: var(--font-serif);">403</p>
        <h2 style="margin-bottom: 8px; font-family: var(--font-sans); font-weight: 600;">Zugriff verweigert</h2>
        <p class="text-secondary" style="margin-bottom: 24px; font-family: var(--font-sans);">Du hast keine Berechtigung, diese Seite zu sehen.</p>
        <a href="{{ url_for('hub.hub') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary btn-lg"><span class="btn-text-blue">Zurück</span></a>
    </div>
</div>
{% endblock %}
