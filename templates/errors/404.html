{% extends "base.html" %}

{% block title %}Seite nicht gefunden (404){% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align: center;">
        <p class="display" style="font-size: 5rem; margin-bottom: 8px;">404</p>
        <h2 style="margin-bottom: 8px;">Seite nicht gefunden</h2>
        <p class="text-secondary" style="margin-bottom: 24px;">Die angeforderte Seite konnte nicht gefunden werden.</p>
        <a href="{{ url_for('hub.hub') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-accent">Zur Startseite</a>
    </div>
</div>
{% endblock %}
