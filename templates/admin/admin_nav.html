{% extends 'base.html' %}

{% block title %}Admin Navigator — MJL-Team{% endblock %}

{% block content %}
<section class="max-w-6xl mx-auto px-6 py-12">
    <div style="margin-bottom: 32px;">
        <h1 style="font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 600; color: var(--ink); margin: 0;">Admin Navigator</h1>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
        <a href="{{ url_for('admin.admin_dashboard') }}" class="card" style="padding: 28px; text-decoration: none;">
            <div style="font-size: 1.25rem; font-weight: 600; color: var(--ink); margin-bottom: 6px;">📊 Dashboard</div>
            <div class="text-sm" style="color: var(--text-secondary);">Statistiken, Logins & System-Übersicht</div>
        </a>
        <a href="{{ url_for('admin.admin_users') }}" class="card" style="padding: 28px; text-decoration: none;">
            <div style="font-size: 1.25rem; font-weight: 600; color: var(--ink); margin-bottom: 6px;">👥 User Management</div>
            <div class="text-sm" style="color: var(--text-secondary);">Benutzer suchen, anzeigen und Rollen ändern</div>
        </a>
    </div>
</section>
{% endblock %}
