{% extends "base.html" %}

{% block title %}Registrieren — MJL-Team{% endblock %}

{% block content %}
<div class="auth-container" x-data="registerForm()">
    <div class="auth-card">

        <div class="auth-header">
            <h2>Registrieren</h2>
        </div>

        <div class="skel-stack">
            <div class="card card-padded skel-overlay">
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-btn"></div>
            </div>

            <div class="card card-padded">
                <form method="post" class="space-y-5" @submit="submitting = true">
                    <div class="form-group">
                        <label for="username" class="form-label">Benutzername</label>
                        <input id="username" name="username" type="text" class="input" placeholder="max.mustermann" autocomplete="username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">
                            E-Mail
                            <span class="form-label-optional">(optional)</span>
                        </label>
                        <input id="email" name="email" type="email" class="input" placeholder="max@beispiel.de" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Passwort</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="input"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                            x-model="password"
                            @input="checkStrength()"
                        >

                        <div class="pw-meter">
                            <template x-for="i in 4" :key="i">
                                <div
                                    class="pw-meter__bar"
                                    :class="{
                                        'pw-meter__bar--active': i <= strength
                                    }"
                                ></div>
                            </template>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg btn-block">
                        <span x-show="!submitting">Konto erstellen</span>
                        <span x-show="submitting" x-cloak style="display: inline-flex; align-items: center; gap: 8px;">
                            <span class="spinner" data-size="md"></span>
                            Lädt…
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <div class="auth-footer">
            Bereits ein Konto?
            <a href="{{ url_for('auth.login') }}">Jetzt anmelden</a>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function registerForm() {
    return {
        submitting: false,
        password: '',
        strength: 0,
        checkStrength() {
            let score = 0;
            const p = this.password || '';
            if (p.length >= 8) score++;
            if (/[A-Z]/.test(p)) score++;
            if (/[a-z]/.test(p)) score++;
            if (/[0-9]/.test(p) || /[^A-Za-z0-9]/.test(p)) score++;
            this.strength = score;
        }
    };
}
</script>
{% endblock %}
