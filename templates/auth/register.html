{% extends "base.html" %}

{% block title %}Registrieren — MJL-Team{% endblock %}

{% block content %}
<div class="auth-container" x-data="registerForm()">
    <div class="auth-card">

        <div class="auth-header">
            <h2>Registrieren</h2>
        </div>

        <div class="skel-stack">
            <div class="card card-padded skel-overlay">
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-btn"></div>
            </div>

            <div class="card card-padded">
                <form method="post" class="space-y-5" @submit="submitting = true">
                    <div class="form-group">
                        <label for="username" class="form-label">Benutzername</label>
                        <input id="username" name="username" type="text" class="input" placeholder="max.mustermann" autocomplete="username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">
                            E-Mail
                            <span class="form-label-optional">(optional)</span>
                        </label>
                        <input id="email" name="email" type="email" class="input" placeholder="max@beispiel.de" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Passwort</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="input"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                            x-model="password"
                            @input="checkStrength()"
                        >

                        <div class="pw-meter">
                            <template x-for="i in 4" :key="i">
                                <div
                                    class="pw-meter__bar"
                                    :class="{
                                        'pw-meter__bar--active': i <= strength
                                    }"
                                ></div>
                            </template>
                        </div>

                        <div class="pw-label" :class="{ 'pw-label--visible': isStrong }">
                            <svg class="pw-label__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            Stark
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg btn-block" :class="{ 'is-loading': submitting }" :disabled="submitting">
                        <span>Konto erstellen</span>
                        <span class="spinner spinner--xl btn-loading-spinner"></span>
                    </button>
                </form>
            </div>
        </div>

        <div class="auth-footer">
            Bereits ein Konto?
            <a href="{{ url_for('auth.login') }}">Jetzt anmelden</a>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function registerForm() {
    return {
        submitting: false,
        password: '',
        strength: 0,
        isStrong: false,
        checkStrength() {
            const p = this.password || '';
            const len = p.length;
            // 4 bars basierend auf Länge, bei 8+ = voll
            let s = 0;
            if (len >= 2) s = 1;
            if (len >= 4) s = 2;
            if (len >= 6) s = 3;
            if (len >= 8) s = 4;
            this.strength = s;
            // Stark = 8+ Zeichen + mindestens 1 Buchstabe
            this.isStrong = len >= 8 && /[A-Za-z]/.test(p);
        }
    };
}
</script>
{% endblock %}
