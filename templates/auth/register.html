{% extends "base.html" %}

{% block title %}Registrieren — MJL-Team{% endblock %}

{% block content %}
<div class="auth-container" x-data="registerForm()">
    <div class="auth-card">

        <div class="auth-header">
            <h2>Registrieren</h2>
        </div>

        <div class="skel-stack">
            <div class="card card-padded skel-overlay">
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-btn"></div>
            </div>

            <div class="card card-padded">
                <form method="post" class="space-y-5" @submit="if (!isStrong) $event.preventDefault(); else submitting = true">
                    <div class="form-group">
                        <label for="username" class="form-label">Benutzername</label>
                        <input id="username" name="username" type="text" class="input" placeholder="max.mustermann" autocomplete="username" required autofocus value="{{ request.form.get('username', '') }}" minlength="3" maxlength="32">
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">
                            E-Mail
                            <span class="form-label-optional">(optional)</span>
                        </label>
                        <input id="email" name="email" type="email" class="input" placeholder="max@beispiel.de" autocomplete="email" value="{{ request.form.get('email', '') }}">
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Passwort</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="input"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                            x-model="password"
                            @input="checkStrength()"
                        >

                        <div class="pw-meter">
                            <template x-for="i in 4" :key="i">
                                <div
                                    class="pw-meter__bar"
                                    :class="barClass(i)"
                                ></div>
                            </template>
                        </div>

                        <div class="pw-hint" x-show="password.length > 0 && !isStrong" x-transition.opacity.duration.200ms x-cloak>
                            Mindestens 8 Zeichen, ein Buchstabe und eine Zahl — danach kannst du fortfahren.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg btn-block" :class="{ 'is-loading': submitting }" :disabled="submitting || !isStrong">
                        <span>Konto erstellen</span>
                        <span class="spinner spinner--xl btn-loading-spinner"></span>
                    </button>
                </form>
            </div>
        </div>

        <div class="auth-footer">
            Bereits ein Konto?
            <a href="{{ url_for('auth.login') }}">Jetzt anmelden</a>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function registerForm() {
    return {
        submitting: false,
        password: '',
        strength: 0,
        isStrong: false,
        barClass(i) {
            return {
                'pw-meter__bar--active': i <= this.strength
            };
        },
        checkStrength() {
            const p = this.password || '';
            const len = p.length;
            const hasLetter = /[A-Za-z]/.test(p);
            const hasNumber = /[0-9]/.test(p);
            // 4 Stufen: rot → gelb → grün → grün (stark)
            let s = 0;
            if (len >= 2) s = 1;       // rot
            if (len >= 5) s = 2;       // gelb
            if (len >= 8) s = 3;       // grün
            if (len >= 8 && hasLetter && hasNumber) s = 4; // stark
            this.strength = s;
            this.isStrong = s >= 4;
        }
    };
}
</script>
{% endblock %}
