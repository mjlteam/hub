{% extends "base.html" %}

{% block title %}Anmelden — MJL-Team{% endblock %}

{% block content %}
<div class="auth-container" x-data="{ submitting: false }">
    <div class="auth-card">

        <div class="auth-header">
            <h2>Anmelden</h2>
        </div>

        <div class="skel-stack">
            <div class="card card-padded skel-overlay">
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-btn"></div>
            </div>

            <div class="card card-padded">
                <form method="post" class="space-y-5" @submit="submitting = true">
                    <input name="next" type="hidden" value="{{ next or '' }}">

                    <div class="form-group">
                        <label for="username" class="form-label">Benutzername oder E-Mail</label>
                        <input id="username" name="username" type="text" class="input" placeholder="max.mustermann" autocomplete="username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Passwort</label>
                        <input id="password" name="password" type="password" class="input" placeholder="••••••••" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg btn-block">
                        <span x-show="!submitting">Anmelden</span>
                        <span x-show="submitting" x-cloak style="display: inline-flex; align-items: center; gap: 8px;">
                            <span class="thinking-ring"></span>
                            Lädt…
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <div class="auth-footer">
            Noch kein Konto?
            <a href="{{ url_for('auth.register') }}">Jetzt registrieren</a>
        </div>

    </div>
</div>
{% endblock %}
