{% extends "base.html" %}

{% block title %}Anmelden — MJL-Team{% endblock %}

{% block content %}
<div class="auth-container" x-data="{ submitting: false }" x-cloak>
    <div class="auth-card">

        <div class="auth-header">
            <h2>Anmelden</h2>
            <p>Login mit GitHub oder deinem bestehenden Konto.</p>
        </div>

        <div class="skel-stack">
            <div class="card card-padded skel-overlay">
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-label"></div>
                <div class="skel skel-input"></div>
                <div class="skel skel-btn"></div>
            </div>

            <div class="card card-padded">
                <form method="post" class="space-y-5" @submit="submitting = true">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input name="next" type="hidden" value="{{ next or '' }}">
                    <input name="screen_w" type="hidden" value="">
                    <input name="screen_h" type="hidden" value="">
                    <input name="lang" type="hidden" value="">

                    <div class="form-group">
                        <label for="username" class="form-label">Benutzername oder E-Mail</label>
                        <input id="username" name="username" type="text" class="input" placeholder="max.mustermann"
                            autocomplete="username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Passwort</label>
                        <input id="password" name="password" type="password" class="input" placeholder="••••••••"
                            autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg btn-block" :class="{ 'is-loading': submitting }"
                        :disabled="submitting">
                        <span>Anmelden</span>
                        <span class="spinner spinner--xl btn-loading-spinner"></span>
                    </button>
                </form>

                <div class="separator-text" aria-hidden="true"><span>oder</span></div>
                <a href="{{ url_for('auth.github_login') }}" class="btn btn-github btn-lg btn-block" aria-label="Mit GitHub anmelden">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49v-1.7c-2.78.62-3.37-1.37-3.37-1.37-.46-1.2-1.11-1.52-1.11-1.52-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.58 2.35 1.12 2.92.86.09-.67.35-1.12.64-1.38-2.22-.26-4.55-1.14-4.55-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.2 9.2 0 0 1 12 6.96c.85 0 1.7.12 2.5.36 1.9-1.33 2.74-1.05 2.74-1.05.56 1.41.21 2.45.11 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.05.36.32.68.94.68 1.9v2.81c0 .27.18.6.69.49A10.24 10.24 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"/></svg>
                    <span>Mit GitHub anmelden</span>
                </a>
            </div>

            <div class="auth-footer">
                Noch kein Konto?
                <a href="{{ url_for('auth.register') }}">Jetzt registrieren</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
